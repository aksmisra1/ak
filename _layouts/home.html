<div class="content">
  {{ content }}
</div>

{% if site.data.education %}
<section class="section">
  <h2>Education</h2>
  {% for item in site.data.education %}
    <div class="entry">
      <h3>{{ item.institution }}</h3>
      <h4>{{ item.degree }}</h4>
      <p>{{ item.description }}</p>
    </div>
  {% endfor %}
</section>
{% endif %}
