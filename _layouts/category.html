---
layout: default
---

<h1>Category: {{ page.title | capitalize }}</h1>

<ul>
  {% for post in site.categories[page.title] %}
    <li>
      <!-- <a href="{{ post.url }}">{{ post.title }}</a> — {{ post.date | date: "%b %-d, %Y" }} -->
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a> — {{ post.date | date: "%b %-d, %Y" }}

    </li>
  {% endfor %}
</ul>
