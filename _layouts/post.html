---
layout: default
---

<div class="post">
  <div class="contents">
    <h4>Contents</h4>
    <ul id="toc"></ul>
  </div>
  
  <article class="post-content">
    <header class="post-header">
      <h1 class="post-title">{{ page.title }}</h1>
      <div class="post-meta">
        <time datetime="{{ page.date | date_to_xmlschema }}">
          {{ page.date | date: "%B %d, %Y" }}
        </time>


        <p class="post-categories">
          Categories:
          {% for category in page.categories %}
            <a href="/category/{{ category | slugify }}/">{{ category | capitalize }}</a>{% unless forloop.last %}, {% endunless %}
          {% endfor %}
        </p>
        
        <!-- {% if page.categories %}
        <span class="categories">
          {% for category in page.categories %}
          <a href="{{ '/categories/' | append: category | relative_url }}">{{ category }}</a>
          {% unless forloop.last %} • {% endunless %}
          {% endfor %}
        </span>
        {% endif %} -->

      </div>
    </header>

    {{ content }}
  </article>

  
</div>

<script>
  // Simple table of contents generator
  document.addEventListener('DOMContentLoaded', function() {
    const headings = document.querySelectorAll('h1, h2');
    const toc = document.getElementById('toc');
    
    headings.forEach(function(heading) {
      const id = heading.textContent.toLowerCase().replace(/[^\w]+/g, '-');
      heading.id = id;
      
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#' + id;
      a.textContent = heading.textContent;
      li.appendChild(a);
      toc.appendChild(li);
    });
  });
</script>
